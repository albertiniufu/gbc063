<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBC063 · S3 — Busca Cega (deck v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--c0:#1F77B4;--c1:#FF7F0E;--c2:#2CA02C;--c5:#8C564B;
  --board:#20262E;--giz:#EAEFF5;--dim:#8A97A5;--board2:#2A313B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#14181E;color:var(--giz);
  font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#palco{position:fixed;inset:0 0 34px 0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:min(96vw,177vh);aspect-ratio:16/9;background:var(--board);
  border-radius:14px;padding:3.2% 4%;display:none;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:2.2vmin;overflow:hidden}
.slide.ativo{display:flex}
.eyebrow{position:absolute;top:2.6%;left:3.4%;font-family:'JetBrains Mono',monospace;
  font-size:1.5vmin;letter-spacing:.14em;color:var(--dim)}
h1{font-size:6.4vmin;margin:0;line-height:1.15}
h2{font-size:5vmin;margin:0;line-height:1.15}
.kw{color:var(--c1)} .az{color:var(--c0)} .vd{color:var(--c2)}
.gr{font-size:9vmin;font-weight:700}
.sub{font-size:2.6vmin;color:var(--dim);margin:0}
.frag{opacity:0;transition:opacity .35s}
.frag.on{opacity:1}
@media(prefers-reduced-motion:reduce){.frag{transition:none}}
canvas.lab{width:72%;max-height:58%;border-radius:8px;background:var(--board2)}
.duplo{display:flex;gap:3%;width:94%;justify-content:center}
.duplo .col{width:48%;display:flex;flex-direction:column;align-items:center;gap:1vmin}
.duplo canvas.lab{width:100%}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl button{font-family:'Space Grotesk';font-size:2vmin;min-height:44px;min-width:44px;
  padding:8px 18px;border-radius:10px;border:2px solid var(--giz);
  background:var(--board2);color:var(--giz);cursor:pointer}
.ctl button:hover{background:#39424E}
.ctl button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.ctl .desastre{border-color:var(--c1);color:var(--c1);font-weight:700}
.ctl .desastre[aria-pressed="true"]{background:var(--c1);color:#20262E}
.vivos{display:flex;gap:4vmin;font-family:'JetBrains Mono',monospace;font-size:2.1vmin;color:var(--dim)}
.vivos b{color:var(--c0);font-size:3.4vmin}
.vivos .lar b{color:var(--c1)}
.eq{font-family:'JetBrains Mono',monospace;font-size:6.5vmin;font-weight:700;display:flex;
  gap:.35em;align-items:baseline;flex-wrap:wrap;justify-content:center}
.eq small{font-size:2.2vmin;color:var(--dim);width:100%;font-family:'Space Grotesk'}
pre.cod{font-family:'JetBrains Mono',monospace;font-size:2.5vmin;text-align:left;
  background:var(--board2);border-radius:10px;padding:2.4vmin 3vmin;line-height:1.6;margin:0}
pre.cod .lin{display:block;opacity:.18;transition:opacity .3s}
pre.cod .lin.on{opacity:1}
pre.cod .lin.sintese.on{background:rgba(255,127,14,.25);border-left:4px solid var(--c1);
  margin-left:-3vmin;padding-left:calc(3vmin - 4px)}
table.mx{border-collapse:collapse;font-size:2.9vmin}
.mx th,.mx td{border:2px solid #39424E;padding:1.2vmin 2.6vmin}
.mx th{color:var(--dim);font-weight:500}
.mx td:first-child{text-align:left;font-weight:700}
.ok{color:var(--c2);font-weight:700}.no{color:#E05C4B;font-weight:700}
/* slides de abertura e plano */
.abertura{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin}
.abertura .autor{font-size:2.4vmin;color:var(--dim)}
.abertura .ufu{font-size:2vmin;color:#5A6675}
.plano-lista{text-align:left;font-size:3vmin;line-height:2.2;list-style:none;padding:0}
.plano-lista li::before{content:"· ";color:var(--c1);font-weight:700}
.plano-lista .parte{color:var(--c0);font-weight:700;font-size:2.4vmin;margin-top:.8em;display:block}
/* slide histórico */
.historico{display:flex;gap:4vmin;align-items:center;width:82%}
.historico .foto{width:28vmin;height:28vmin;border-radius:50%;border:3px solid var(--c0);
  background:var(--board2);display:flex;align-items:center;justify-content:center;
  font-size:12vmin;overflow:hidden;flex-shrink:0}
.historico .foto img{width:100%;height:100%;object-fit:cover}
.historico .bio{text-align:left;flex:1}
.historico .bio .nome{font-size:4.2vmin;font-weight:700;color:var(--giz)}
.historico .bio .anos{font-size:2.2vmin;color:var(--dim);margin-bottom:1.2vmin}
.historico .bio .legado{font-size:2.6vmin;line-height:1.5;color:var(--giz)}
.historico .bio .legado b{color:var(--c1)}
/* transição */
.transicao{background:var(--board2)}
.transicao h2{font-size:7vmin}
.transicao .gancho{font-size:3vmin;color:var(--dim)}
/* slide de links */
.links-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin;width:90%;text-align:left}
.links-grid .lk{background:var(--board2);border-radius:8px;padding:1.8vmin 2.2vmin;
  font-size:1.9vmin;line-height:1.45}
.links-grid .lk .cat{font-size:1.5vmin;color:var(--c1);font-weight:700;letter-spacing:.06em}
.links-grid .lk a{color:var(--c0);text-decoration:none;font-weight:700;font-size:2vmin}
.links-grid .lk a:hover{text-decoration:underline}
.links-grid .lk .desc{color:var(--dim);font-size:1.7vmin;margin-top:.3vmin}
/* navegação */
#nav{position:fixed;bottom:44px;right:16px;display:flex;gap:8px;z-index:40}
#nav button{width:52px;height:52px;border-radius:50%;border:2px solid #4A5563;
  background:rgba(42,49,59,.9);color:var(--giz);font-size:22px;cursor:pointer}
#nav button:hover{background:#39424E}
#rodape{position:fixed;bottom:0;left:0;right:0;height:34px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:#5A6675;background:#101318}
#pres{position:fixed;inset:0;background:rgba(10,12,16,.96);z-index:60;display:none;
  padding:4vmin;grid-template-columns:1.4fr 1fr;gap:3vmin}
#pres.on{display:grid}
#pres h3{color:var(--c1);font-size:2.4vmin;margin:0 0 1vmin}
#pres .notas{font-size:2.4vmin;line-height:1.6;overflow:auto;white-space:pre-line}
#pres .lado{display:flex;flex-direction:column;gap:2vmin}
#pres .relogio{font-family:'JetBrains Mono',monospace;font-size:7vmin;color:var(--c2)}
#pres .prox{background:var(--board2);border-radius:10px;padding:2vmin;font-size:2.4vmin;color:var(--dim)}
.quadros{display:none;grid-template-columns:repeat(3,1fr);gap:1.2vmin;width:86%}
.quadros canvas{width:100%;border-radius:6px;background:var(--board2)}
.fallback .quadros{display:grid}
.fallback canvas.lab,.fallback .ctl,.fallback .vivos{display:none}
.notes{display:none}
svg text{font-family:'Space Grotesk'}
/* puzzle grid */
.puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:28vmin}
.puzzle-grid .cel{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:4vmin;font-weight:700;font-family:'JetBrains Mono',monospace}
.puzzle-grid .cel.num{background:#2E5F8A;color:var(--giz)}
.puzzle-grid .cel.vazio{background:transparent;border:2px dashed #4A5563}
.puzzle-grid .cel.obj{background:#1E5A1E;color:var(--giz)}
</style>
</head>
<body>

<div id="palco"></div>

<div id="nav" aria-label="Navegação">
  <button id="nvFrag" title="Revelar próximo passo">▾</button>
  <button id="nvAnt" title="Slide anterior">‹</button>
  <button id="nvProx" title="Próximo slide">›</button>
</div>
<div id="rodape">
  <span>GBC063 · Semana 3 · Busca cega</span>
  <span id="pgn">1/1</span>
  <span>← → slides · ↓ passo · N apresentador · F quadros estáticos</span>
</div>

<div id="pres" aria-hidden="true">
  <div><h3>Notas do apresentador</h3><div class="notas" id="pNotas"></div></div>
  <div class="lado">
    <div><h3>Cronômetro</h3><div class="relogio" id="pTimer">00:00</div></div>
    <div><h3>Próximo slide</h3><div class="prox" id="pProx"></div></div>
    <div class="sub">N fecha · setas continuam funcionando</div>
  </div>
</div>

<template id="slides">

<!-- 1 · abertura com autoria -->
<section class="slide abertura">
  <svg viewBox="0 0 180 180" style="width:18vmin;opacity:.7">
    <circle cx="90" cy="90" r="78" fill="none" stroke="#1F77B4" stroke-width="3"/>
    <circle cx="90" cy="90" r="52" fill="none" stroke="#FF7F0E" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="90" cy="90" r="14" fill="#2CA02C"/>
    <path d="M90 90 L130 50 M90 90 L50 130" stroke="#EAEFF5" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <h1 style="font-size:5.2vmin">Busca Cega</h1>
  <p style="font-size:3vmin;color:var(--dim)">BFS · DFS · Custo Uniforme</p>
  <p class="autor">Prof. Marcelo Keese Albertini</p>
  <p class="ufu">Faculdade de Computação · Universidade Federal de Uberlândia</p>
  <p class="ufu" style="margin-top:1vmin">GBC063 — Inteligência Artificial · Semana 3</p>
  <aside class="notes">ABERTURA COM AUTORIA. Slide de capa — 30 segundos. Apresentar-se, anunciar o tema, avançar para o plano da aula.</aside>
</section>

<!-- 2 · plano da aula -->
<section class="slide">
  <p class="sub">roteiro</p>
  <h2>plano da aula</h2>
  <ul class="plano-lista">
    <span class="parte">Parte 1 — BFS e DFS (~1h50)</span>
    <li>formular problemas como espaço de estados</li>
    <li>a fronteira e os explorados — o esqueleto único</li>
    <li>BFS: onda com fila (FIFO)</li>
    <li>DFS: túnel com pilha (LIFO)</li>
    <li>o código-coração e a linha que muda tudo</li>
    <span class="parte">Parte 2 — Custo Uniforme e análise (~1h50)</span>
    <li>quando os passos têm preços diferentes</li>
    <li>custo uniforme: fila de prioridade por g(n)</li>
    <li>o placar: completude, otimalidade, complexidade</li>
    <li>o muro b<sup>d</sup> e a ponte para o aprendizado</li>
  </ul>
  <aside class="notes">PLANO DA AULA. Ler os tópicos em 30s. Explicar que a aula tem duas metades (A e B) com um intervalo entre elas, e que há slides "sua vez" espalhados. Zero surpresas — a turma sabe o que vem.</aside>
</section>

<!-- 3 · abertura fria -->
<section class="slide" data-sim="bfs" data-auto="1">
  <canvas class="lab" width="960" height="660"></canvas>
  <aside class="notes">ABERTURA FRIA. Deixe o labirinto se resolvendo em loop enquanto a turma entra. Quando começar: "isso que vocês estão vendo é a aula inteira de hoje. No fim, vocês vão saber exatamente o que essa mancha azul é, por que ela cresce assim, e o que ela custa." Tempo: 1 min.</aside>
</section>

<!-- 4 · pergunta condutora -->
<section class="slide">
  <p class="sub">a pergunta de hoje</p>
  <h1>Como decidir quando o <span class="az">mapa do mundo</span> é perfeito?</h1>
  <aside class="notes">Pergunta condutora — volta respondida no penúltimo slide. Conectar com S2: "semana passada, env.step() era caixa-preta. Hoje ela é de vidro: sabemos exatamente aonde cada ação leva. O que fazer com esse superpoder?" Tempo: 2 min.</aside>
</section>

<!-- 5 · mesma interface -->
<section class="slide">
  <h2>a interface da <span class="az">Semana 2</span></h2>
  <pre class="cod"><span class="lin on">obs = env.reset()</span><span class="lin frag">while not done:</span><span class="lin frag">    acao = agente.decidir(obs)</span><span class="lin frag sintese">    obs, done = env.step(acao)   # hoje: transparente</span></pre>
  <aside class="notes">Revele linha a linha (↓). Na última linha (laranja): "a ÚNICA diferença de hoje é que conhecemos step() por dentro — e determinístico. Isso transforma decidir em PLANEJAR: simular futuros de graça, na cabeça, antes de agir de verdade." Plantar: "quando step() voltar a ser opaco, isso vira RL." Tempo: 3 min.</aside>
</section>

<!-- 6 · formulação -->
<section class="slide">
  <h2>problema de busca</h2>
  <svg viewBox="0 0 900 300" style="width:82%">
    <circle cx="90" cy="150" r="34" fill="#1F77B4"/><text x="90" y="157" text-anchor="middle" font-size="26" fill="#20262E" font-weight="700">s₀</text>
    <text x="90" y="225" text-anchor="middle" font-size="22" fill="#EAEFF5">início</text>
    <g class="frag"><path d="M130 130 L250 80 M130 150 L250 150 M130 170 L250 220" stroke="#FF7F0E" stroke-width="5" marker-end="url(#m1)"/>
      <text x="185" y="55" text-anchor="middle" font-size="22" fill="#FF7F0E" font-weight="700">ações</text></g>
    <g class="frag"><circle cx="290" cy="80" r="26" fill="#39424E"/><circle cx="290" cy="150" r="26" fill="#39424E"/><circle cx="290" cy="220" r="26" fill="#39424E"/>
      <text x="290" y="270" text-anchor="middle" font-size="22" fill="#EAEFF5">T(s,a)</text></g>
    <g class="frag"><path d="M320 150 h130 M320 80 q80 0 130 55 M320 220 q80 0 130 -55" stroke="#4A5563" stroke-width="3" stroke-dasharray="8 7"/>
      <text x="390" y="130" text-anchor="middle" font-size="22" fill="#8A97A5">custo(s,a)</text></g>
    <g class="frag"><circle cx="500" cy="150" r="34" fill="#2CA02C"/><text x="500" y="158" text-anchor="middle" font-size="30">🏁</text>
      <text x="500" y="225" text-anchor="middle" font-size="22" fill="#2CA02C" font-weight="700">objetivo(s)</text></g>
    <g class="frag"><rect x="600" y="90" width="270" height="120" rx="12" fill="none" stroke="#FF7F0E" stroke-width="3"/>
      <text x="735" y="140" text-anchor="middle" font-size="24" fill="#EAEFF5">solução =</text>
      <text x="735" y="178" text-anchor="middle" font-size="24" fill="#FF7F0E" font-weight="700">sequência de ações</text></g>
    <defs><marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#FF7F0E"/></marker></defs>
  </svg>
  <aside class="notes">Construa o diagrama por fragmentos (↓): estado inicial → ações → transição → custo → objetivo → solução. Falar cada componente com exemplo duplo (labirinto E 8-puzzle). "Formular é a habilidade; os algoritmos são genéricos." Tempo: 5 min.</aside>
</section>

<!-- 7 · 8-puzzle visual -->
<section class="slide">
  <h2>8-puzzle — <span class="az">nosso laboratório</span></h2>
  <div style="display:flex;gap:6vmin;align-items:center">
    <div style="text-align:center">
      <p class="sub" style="margin-bottom:1.2vmin">estado inicial</p>
      <div class="puzzle-grid">
        <div class="cel num">7</div><div class="cel num">2</div><div class="cel num">4</div>
        <div class="cel num">5</div><div class="cel vazio"></div><div class="cel num">6</div>
        <div class="cel num">8</div><div class="cel num">3</div><div class="cel num">1</div>
      </div>
    </div>
    <div style="font-size:6vmin;color:var(--c1)">→ ? →</div>
    <div style="text-align:center">
      <p class="sub" style="margin-bottom:1.2vmin">objetivo</p>
      <div class="puzzle-grid">
        <div class="cel obj">1</div><div class="cel obj">2</div><div class="cel obj">3</div>
        <div class="cel obj">4</div><div class="cel obj">5</div><div class="cel obj">6</div>
        <div class="cel obj">7</div><div class="cel obj">8</div><div class="cel vazio"></div>
      </div>
    </div>
  </div>
  <p class="sub frag">cada estado = <span class="kw">uma</span> configuração · 181.440 estados alcançáveis · <span class="az">b</span> ≤ 4</p>
  <aside class="notes">Mostrar o 8-puzzle concreto. Apontar: "o espaço em branco é o que se move; cada deslize é uma ação." O contador do slide seguinte mostra quantos estados existem. "Parece pouco? O BFS no 8-puzzle com 26 movimentos de embaralhamento expande centenas de milhares de nós — e pode explodir a memória do Colab. Com 30 movimentos, não termina." Isso planta a motivação da S4. Tempo: 2 min.</aside>
</section>

<!-- 8 · 8-puzzle contador -->
<section class="slide">
  <h2>8-puzzle — espaço de estados</h2>
  <div class="gr az" id="puz">0</div>
  <p class="sub frag">estados alcançáveis — para <span class="kw">nove</span> peças</p>
  <aside class="notes">O contador sobe até 181.440 (9!/2). Deixar subir em silêncio; quando travar: "isso é um brinquedo de criança. Xadrez: 10^47. Go: 10^170. Enumerar não escala — mas vamos enumerar DIREITO primeiro, para entender exatamente o que não escala." Tempo: 2 min.</aside>
</section>

<!-- 9 · árvore -->
<section class="slide">
  <h2>árvore de busca</h2>
  <svg viewBox="0 0 900 330" style="width:78%">
    <circle cx="450" cy="40" r="22" fill="#1F77B4"/>
    <g class="frag">
      <path d="M450 62 L250 130 M450 62 L450 130 M450 62 L650 130" stroke="#4A5563" stroke-width="3"/>
      <circle cx="250" cy="150" r="18" fill="#39424E"/><circle cx="450" cy="150" r="18" fill="#39424E"/><circle cx="650" cy="150" r="18" fill="#39424E"/>
      <text x="820" y="155" font-size="26" fill="#FF7F0E" font-weight="700">b</text>
    </g>
    <g class="frag">
      <path d="M250 168 L180 240 M250 168 L250 240 M250 168 L320 240 M450 168 L380 240 M450 168 L450 240 M450 168 L520 240 M650 168 L580 240 M650 168 L650 240 M650 168 L720 240" stroke="#4A5563" stroke-width="2"/>
      <g fill="#39424E"><circle cx="180" cy="255" r="14"/><circle cx="250" cy="255" r="14"/><circle cx="320" cy="255" r="14"/><circle cx="380" cy="255" r="14"/><circle cx="450" cy="255" r="14"/><circle cx="520" cy="255" r="14"/><circle cx="580" cy="255" r="14"/><circle cx="650" cy="255" r="14"/><circle cx="720" cy="255" r="14"/></g>
      <text x="820" y="260" font-size="26" fill="#FF7F0E" font-weight="700">b²</text>
    </g>
    <g class="frag"><text x="450" y="315" text-anchor="middle" font-size="28" fill="#EAEFF5">nível d: <tspan fill="#FF7F0E" font-weight="700">b</tspan><tspan fill="#FF7F0E" font-weight="700" baseline-shift="super" font-size="20">d</tspan> nós</text></g>
  </svg>
  <aside class="notes">Fragmentos: raiz → nível b → nível b² → conclusão b^d. Perguntar: "quantos nós no nível 3? E no nível d?" A cor laranja do b aqui é a MESMA da equação do slide de memória — casamento de cores proposital. Tempo: 3 min.</aside>
</section>

<!-- 10 · fronteira × explorados -->
<section class="slide">
  <h2><span class="kw">fronteira</span> e <span class="az">explorados</span></h2>
  <svg viewBox="0 0 640 300" style="width:56%">
    <circle cx="320" cy="150" r="120" fill="none" stroke="#39424E" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="320" cy="150" r="78" fill="#1F77B4" opacity=".35"/>
    <circle cx="320" cy="150" r="78" fill="none" stroke="#FF7F0E" stroke-width="9" id="anel"/>
    <circle cx="320" cy="150" r="8" fill="#EAEFF5"/>
    <text x="320" y="120" text-anchor="middle" font-size="20" fill="#9CC4E4">explorados</text>
    <text x="320" y="52" text-anchor="middle" font-size="20" fill="#FF7F0E" font-weight="700">fronteira</text>
    <text x="530" y="270" font-size="18" fill="#5A6675">desconhecido</text>
  </svg>
  <p class="sub frag">o algoritmo inteiro: <span class="kw">quem sai da fronteira primeiro?</span></p>
  <aside class="notes">Metáfora da tinta que se espalha: o azul é o que já sabemos alcançar; o anel laranja é a lista de candidatos. TODOS os algoritmos de hoje diferem numa única decisão: quem sai do anel primeiro. Fila → BFS. Pilha → DFS. Mais barato → custo uniforme. Repetir 3×, é a frase da aula. Tempo: 3 min.</aside>
</section>

<!-- 11 · 📜 Momento histórico — Dijkstra -->
<section class="slide historico">
  <div class="foto"><div style="font-size:10vmin;color:var(--giz)">Edsger<br>Dijkstra</div></div>
  <div class="bio">
    <div class="nome">Edsger W. Dijkstra</div>
    <div class="anos">1930–2002 · Turing Award 1972</div>
    <div class="legado">
      Em 1959, enquanto trabalhava no <b>Mathematisch Centrum</b> em Amsterdam, Dijkstra publicou o algoritmo do caminho mais curto que leva seu nome — <b>23 linhas de ALGOL</b> que resolviam o problema em 20 segundos numa máquina de 1956, "um feito que agradou bastante a uma plateia de não-computadores".<br><br>
      Hoje reencontramos esse algoritmo como <b>busca de custo uniforme</b>: troque o comprimento do fio pela soma dos custos do caminho — a estrutura é a mesma, e ela vive dentro de todo roteador do planeta.
    </div>
  </div>

<!-- 27 · código UCS -->
<section class="slide">
  <h2>o coração do <span class="vd">custo uniforme</span></h2>
  <pre class="cod" style="font-size:2.2vmin"><span class="lin on">import heapq</span><span class="lin on">def custo_uniforme(inicio, objetivo, vizinhos):</span><span class="lin frag">    fronteira = [(0, inicio)]</span><span class="lin frag">    g = {inicio: 0}</span><span class="lin frag">    veio_de = {inicio: None}</span><span class="lin frag">    while fronteira:</span><span class="lin frag">        custo, s = heapq.heappop(fronteira)</span><span class="lin frag">        if custo > g.get(s, float("inf")): continue</span><span class="lin frag">        if s == objetivo: return reconstruir(veio_de, s), custo</span><span class="lin frag">        for v, passo in vizinhos(s):</span><span class="lin frag">            novo_g = g[s] + passo</span><span class="lin frag sintese">            if novo_g < g.get(v, float("inf")):</span><span class="lin frag">                g[v] = novo_g; veio_de[v] = s</span><span class="lin frag">                heapq.heappush(fronteira, (novo_g, v))</span></pre>
  <aside class="notes">Revelar linha a linha (↓). Parar na linha laranja: "a melhoria de g é o coração — sem ela, o heap acumula entradas obsoletas e a complexidade degrada." A estrutura é a mesma da BFS: fronteira, veio_de, loop. A ÚNICA diferença é a prioridade (g em vez de ordem de chegada) e a necessidade de verificar se o custo melhorou (entrada obsoleta). Tempo: 4 min.</aside>
</section>

<script>
(function(){
"use strict";
/* ====== ambiente compartilhado com o material de estudo ====== */
const MAZE=["################","#..............#","#.####.##.###..#","#.#..#.....##..#",
"#.#..#.###.....#","#S...........G.#","#.#..#.###.....#","#.#..#.....##..#",
"#.####.##.###..#","#..............#","################"];
const H=MAZE.length,W=MAZE[0].length,key=(x,y)=>x+","+y;
const SWAMP=new Set([[7,3],[8,3],[9,3],[9,2],[7,5],[8,5],[9,5],[7,7],[8,7],[9,7],[9,8]].map(p=>key(p[0],p[1])));
let S,G;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(MAZE[y][x]==="S")S=[x,y];if(MAZE[y][x]==="G")G=[x,y];}
const viz=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].map(d=>[x+d[0],y+d[1]]).filter(p=>MAZE[p[1]][p[0]]!=="#");
function rodar(algo,pantano){
  const custo=(x,y)=>(pantano&&SWAMP.has(key(x,y)))?5:1;
  const steps=[],veio={};veio[key(S[0],S[1])]=null;let custoFinal=null;
  if(algo==="ucs"){
    const g={};g[key(S[0],S[1])]=0;const heap=[[0,S]];const done=new Set();
    while(heap.length){
      heap.sort((a,b)=>a[0]-b[0]);const[c,s]=heap.shift();const ks=key(s[0],s[1]);
      if(done.has(ks))continue;done.add(ks);
      steps.push({cell:s,frontier:heap.filter(e=>!done.has(key(e[1][0],e[1][1]))).map(e=>e[1])});
      if(s[0]===G[0]&&s[1]===G[1]){custoFinal=c;break;}
      for(const v of viz(s[0],s[1])){const kv=key(v[0],v[1]);const ng=c+custo(v[0],v[1]);
        if(ng<(g[kv]??Infinity)){g[kv]=ng;veio[kv]=s;heap.push([ng,v]);}}}
  }else{
    const fr=[S];
    while(fr.length){
      const s=(algo==="bfs")?fr.shift():fr.pop();
      steps.push({cell:s,frontier:fr.slice()});
      if(s[0]===G[0]&&s[1]===G[1])break;
      for(const v of viz(s[0],s[1])){const kv=key(v[0],v[1]);
        if(!(kv in veio)){veio[kv]=s;fr.push(v);}}}
  }
  let c=G,path=[];while(c){path.push(c);c=veio[key(c[0],c[1])];}path.reverse();
  if(custoFinal===null)custoFinal=path.slice(1).reduce((a,p)=>a+custo(p[0],p[1]),0);
  return{steps,path,custo:custoFinal,custoFn:custo};
}
function desenhaEstado(ctx,cvW,cvH,run,k,pantano){
  const CS=cvW/W;ctx.clearRect(0,0,cvW,cvH);
  const exp=new Set();for(let i=0;i<=k&&i<run.steps.length;i++){const c=run.steps[i].cell;exp.add(key(c[0],c[1]));}
  const fr=new Set();if(k>=0&&k<run.steps.length)for(const c of run.steps[k].frontier)fr.add(key(c[0],c[1]));
  const fim=k>=run.steps.length-1;
  const ps=new Set();if(fim)for(const c of run.path)ps.add(key(c[0],c[1]));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const px=x*CS,py=y*CS,kx=key(x,y);
    if(MAZE[y][x]==="#"){ctx.fillStyle="#14181E";ctx.fillRect(px,py,CS,CS);continue;}
    ctx.fillStyle="#3A434F";
    if(pantano&&SWAMP.has(kx))ctx.fillStyle="#8C564B";
    if(exp.has(kx))ctx.fillStyle="#2E5F8A";
    if(fr.has(kx))ctx.fillStyle="#FF7F0E";
    if(ps.has(kx))ctx.fillStyle="#2CA02C";
    ctx.fillRect(px,py,CS,CS);
    ctx.strokeStyle="#1B2027";ctx.strokeRect(px,py,CS,CS);}
  ctx.font="bold "+(CS*.62)+"px 'Space Grotesk'";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#EAEFF5";ctx.fillText("S",S[0]*CS+CS/2,S[1]*CS+CS/2);
  ctx.fillText("G",G[0]*CS+CS/2,G[1]*CS+CS/2);
}
/* ====== monta o deck ====== */
const palco=document.getElementById("palco");
palco.appendChild(document.getElementById("slides").content.cloneNode(true));
const slides=[...palco.querySelectorAll(".slide")];
slides.forEach((s,i)=>{
  const e=document.createElement("span");e.className="eyebrow";
  e.textContent="GBC063 · S3 · BUSCA CEGA — "+(i+1).toString().padStart(2,"0");
  if(i>0)s.appendChild(e);});
const reduz=matchMedia("(prefers-reduced-motion: reduce)").matches;
let atual=0;
const sims=new Map();

function montaSim(sl){
  if(sims.has(sl))return sims.get(sl);
  const algo=sl.dataset.sim,des=sl.dataset.des==="1";
  const cv=sl.querySelector("canvas.lab"),ctx=cv.getContext("2d");
  const st={algo,pantano:des,run:rodar(algo,des),k:-1,timer:null,cv,ctx,sl};
  const draw=()=>{desenhaEstado(ctx,cv.width,cv.height,st.run,st.k,st.pantano);
    const q=(c,v)=>{const el=sl.querySelector(c);if(el)el.textContent=v;};
    q(".vExp",Math.max(0,Math.min(st.k+1,st.run.steps.length)));
    q(".vFront",(st.k>=0&&st.k<st.run.steps.length)?st.run.steps[st.k].frontier.length:1);
    q(".vCusto",st.k>=st.run.steps.length-1?st.run.custo:"—");};
  st.draw=draw;
  st.passo=()=>{if(st.k<st.run.steps.length-1){st.k++;draw();return true;}return false;};
  st.reset=()=>{clearInterval(st.timer);st.timer=null;st.run=rodar(st.algo,st.pantano);st.k=-1;draw();};
  const bp=sl.querySelector(".bPasso"),br=sl.querySelector(".bReset"),bd=sl.querySelector(".bDes");
  if(bp)bp.addEventListener("click",st.passo);
  if(br)br.addEventListener("click",st.reset);
  if(bd)bd.addEventListener("click",()=>{st.pantano=!st.pantano;
    bd.setAttribute("aria-pressed",String(st.pantano));st.reset();});
  st.quadros=()=>{
    const box=sl.querySelector(".quadros");if(!box||box.childElementCount)return;
    const n=st.run.steps.length;
    [0,.2,.4,.6,.8,1].forEach(f=>{
      const c=document.createElement("canvas");c.width=480;c.height=330;
      box.appendChild(c);
      desenhaEstado(c.getContext("2d"),480,330,st.run,Math.max(0,Math.round((n-1)*f)),st.pantano);});
  };
  draw();sims.set(sl,st);return st;
}
function montaRace(sl){
  if(sims.has(sl))return sims.get(sl);
  const raceType=sl.dataset.race||"1";
  // race 1: BFS vs DFS (sem pântano) · race 2: BFS vs UCS (com pântano)
  const pantano=raceType==="2";
  const algoA="bfs",algoB=raceType==="2"?"ucs":"dfs";
  const c1=sl.querySelector(".r1"),c2=sl.querySelector(".r2");
  const st={a:rodar(algoA,pantano),b:rodar(algoB,pantano),k1:-1,k2:-1,pantano};
  const draw=()=>{
    desenhaEstado(c1.getContext("2d"),c1.width,c1.height,st.a,st.k1,st.pantano);
    desenhaEstado(c2.getContext("2d"),c2.width,c2.height,st.b,st.k2,st.pantano);
    sl.querySelector(".vE1").textContent=Math.max(0,st.k1+1);
    sl.querySelector(".vE2").textContent=Math.max(0,st.k2+1);
    const c1El=sl.querySelector(".vC1"),c2El=sl.querySelector(".vC2");
    const fim1=st.k1>=st.a.steps.length-1&&st.a.path,fim2=st.k2>=st.b.steps.length-1&&st.b.path;
    if(c1El)c1El.textContent=fim1?st.a.custo:"—";
    if(c2El)c2El.textContent=fim2?st.b.custo:"—";};
  st.passo=()=>{let m=false;
    if(st.k1<st.a.steps.length-1){st.k1++;m=true;}
    if(st.k2<st.b.steps.length-1){st.k2++;m=true;}
    draw();return m;};
  st.reset=()=>{st.k1=-1;st.k2=-1;draw();};
  sl.querySelector(".bPasso").addEventListener("click",st.passo);
  sl.querySelector(".bReset").addEventListener("click",st.reset);
  draw();sims.set(sl,st);return st;
}
/* contadores animados */
function contador(el,alvo,ms){
  if(reduz){el.textContent=alvo.toLocaleString("pt-BR");return;}
  const t0=performance.now();
  const tick=t=>{const p=Math.min(1,(t-t0)/ms);
    el.textContent=Math.round(alvo*p*p).toLocaleString("pt-BR");
    if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}
/* abertura fria: loop automático */
let autoTimer=null;
function entraSlide(i){
  slides[atual].classList.remove("ativo");
  clearInterval(autoTimer);autoTimer=null;
  for(const st of sims.values())if(st.timer){clearInterval(st.timer);st.timer=null;}
  atual=Math.max(0,Math.min(slides.length-1,i));
  const sl=slides[atual];sl.classList.add("ativo");
  document.getElementById("pgn").textContent=(atual+1)+"/"+slides.length;
  if(sl.dataset.sim)montaSim(sl);
  if(sl.dataset.race)montaRace(sl);
  if(sl.dataset.auto==="1"&&!reduz){
    const st=montaSim(sl);
    autoTimer=setInterval(()=>{if(!st.passo())st.reset();},120);
  }
  if(sl.querySelector("#puz"))contador(sl.querySelector("#puz"),181440,2600);
  atualizaPres();
}
function fragAvanca(){
  const sl=slides[atual];
  const f=sl.querySelector(".frag:not(.on)");
  if(f){f.classList.add("on");return true;}
  if(sl.dataset.sim&&sl.dataset.auto!=="1")return montaSim(sl).passo();
  if(sl.dataset.race)return montaRace(sl).passo();
  return false;
}
/* ====== navegação ====== */
document.getElementById("nvProx").addEventListener("click",()=>entraSlide(atual+1));
document.getElementById("nvAnt").addEventListener("click",()=>entraSlide(atual-1));
document.getElementById("nvFrag").addEventListener("click",fragAvanca);
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown")entraSlide(atual+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")entraSlide(atual-1);
  else if(e.key==="ArrowDown"||e.key===" "){e.preventDefault();fragAvanca();}
  else if(e.key==="n"||e.key==="N")togglePres();
  else if(e.key==="f"||e.key==="F")toggleFallback();
});
/* toque */
let tx=null,ty=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))entraSlide(atual+(dx<0?1:-1));
  else if(Math.abs(dx)<10&&Math.abs(dy)<10&&!e.target.closest("button,select"))fragAvanca();
  tx=null;},{passive:true});
/* ====== modo apresentador ====== */
const pres=document.getElementById("pres");let t0=null,relogio=null;
function togglePres(){
  pres.classList.toggle("on");
  pres.setAttribute("aria-hidden",String(!pres.classList.contains("on")));
  if(pres.classList.contains("on")&&!t0){
    t0=Date.now();
    relogio=setInterval(()=>{
      const s=Math.floor((Date.now()-t0)/1000);
      document.getElementById("pTimer").textContent=
        String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);}
  atualizaPres();
}
function atualizaPres(){
  if(!pres.classList.contains("on"))return;
  const n=slides[atual].querySelector(".notes");
  document.getElementById("pNotas").textContent=n?n.textContent.trim():"(sem notas)";
  const px=slides[atual+1];
  document.getElementById("pProx").textContent=px?
    (px.querySelector("h1,h2")?.textContent||"(slide visual)"):"— fim do deck —";
}
/* ====== fallback: quadros estáticos ====== */
function toggleFallback(){
  const sl=slides[atual];
  if(!sl.dataset.sim)return;
  const st=montaSim(sl);st.quadros();
  sl.classList.toggle("fallback");
}
if(reduz)document.querySelectorAll(".slide[data-auto]").forEach(s=>s.removeAttribute("data-auto"));
entraSlide(0);
})();
</script>
